naftiko: 1.0.0-alpha2
info:
  label: Fly.io Extensions API — SSO
  description: 'Fly.io Extensions API — SSO. 1 operations. Lead operation: Initiate SSO for an extension. Self-contained Naftiko
    capability covering one Fly Io business surface.'
  tags:
  - Fly Io
  - SSO
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FLY_IO_API_KEY: FLY_IO_API_KEY
capability:
  consumes:
  - type: http
    namespace: extensions-sso
    baseUri: https://{provider_base_url}
    description: Fly.io Extensions API — SSO business capability. Self-contained, no shared references.
    resources:
    - name: extensions-extension_id-sso
      path: /extensions/{extension_id}/sso
      operations:
      - name: initiatesso
        method: GET
        description: Initiate SSO for an extension
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.FLY_IO_API_KEY}}'
  exposes:
  - type: rest
    namespace: extensions-sso-rest
    port: 8080
    description: REST adapter for Fly.io Extensions API — SSO. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/extensions/{extension-id}/sso
      name: extensions-extension-id-sso
      description: REST surface for extensions-extension_id-sso.
      operations:
      - method: GET
        name: initiatesso
        description: Initiate SSO for an extension
        call: extensions-sso.initiatesso
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: extensions-sso-mcp
    port: 9090
    transport: http
    description: MCP adapter for Fly.io Extensions API — SSO. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: initiate-sso-extension
      description: Initiate SSO for an extension
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: extensions-sso.initiatesso
      outputParameters:
      - type: object
        mapping: $.
