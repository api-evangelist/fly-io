naftiko: 1.0.0-alpha2
info:
  label: Fly.io Machines API — Apps
  description: 'Fly.io Machines API — Apps. 4 operations. Lead operation: List apps in an organization. Self-contained Naftiko
    capability covering one Fly Io business surface.'
  tags:
  - Fly Io
  - Apps
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FLY_IO_API_KEY: FLY_IO_API_KEY
capability:
  consumes:
  - type: http
    namespace: machines-apps
    baseUri: https://api.machines.dev
    description: Fly.io Machines API — Apps business capability. Self-contained, no shared references.
    resources:
    - name: v1-apps
      path: /v1/apps
      operations:
      - name: listapps
        method: GET
        description: List apps in an organization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createapp
        method: POST
        description: Create a Fly App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-apps-app_name
      path: /v1/apps/{app_name}
      operations:
      - name: getapp
        method: GET
        description: Get a Fly App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: deleteapp
        method: DELETE
        description: Delete a Fly App
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: force
          in: query
          type: boolean
          description: When true, all running Machines in the app are stopped before deletion proceeds. Without this flag,
            deletion fails if any Machines are running.
    authentication:
      type: bearer
      token: '{{env.FLY_IO_API_KEY}}'
  exposes:
  - type: rest
    namespace: machines-apps-rest
    port: 8080
    description: REST adapter for Fly.io Machines API — Apps. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/apps
      name: v1-apps
      description: REST surface for v1-apps.
      operations:
      - method: GET
        name: listapps
        description: List apps in an organization
        call: machines-apps.listapps
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapp
        description: Create a Fly App
        call: machines-apps.createapp
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/apps/{app-name}
      name: v1-apps-app-name
      description: REST surface for v1-apps-app_name.
      operations:
      - method: GET
        name: getapp
        description: Get a Fly App
        call: machines-apps.getapp
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deleteapp
        description: Delete a Fly App
        call: machines-apps.deleteapp
        with:
          force: rest.force
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: machines-apps-mcp
    port: 9090
    transport: http
    description: MCP adapter for Fly.io Machines API — Apps. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-apps-organization
      description: List apps in an organization
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: machines-apps.listapps
      outputParameters:
      - type: object
        mapping: $.
    - name: create-fly-app
      description: Create a Fly App
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: machines-apps.createapp
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-fly-app
      description: Get a Fly App
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: machines-apps.getapp
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-fly-app
      description: Delete a Fly App
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: machines-apps.deleteapp
      with:
        force: tools.force
      outputParameters:
      - type: object
        mapping: $.
