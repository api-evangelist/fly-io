naftiko: 1.0.0-alpha2
info:
  label: Fly.io Machines API — Tokens
  description: 'Fly.io Machines API — Tokens. 1 operations. Lead operation: Get an OIDC token. Self-contained Naftiko capability
    covering one Fly Io business surface.'
  tags:
  - Fly Io
  - Tokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    FLY_IO_API_KEY: FLY_IO_API_KEY
capability:
  consumes:
  - type: http
    namespace: machines-tokens
    baseUri: https://api.machines.dev
    description: Fly.io Machines API — Tokens business capability. Self-contained, no shared references.
    resources:
    - name: v1-tokens-oidc
      path: /v1/tokens/oidc
      operations:
      - name: getoidctoken
        method: POST
        description: Get an OIDC token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.FLY_IO_API_KEY}}'
  exposes:
  - type: rest
    namespace: machines-tokens-rest
    port: 8080
    description: REST adapter for Fly.io Machines API — Tokens. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/v1/tokens/oidc
      name: v1-tokens-oidc
      description: REST surface for v1-tokens-oidc.
      operations:
      - method: POST
        name: getoidctoken
        description: Get an OIDC token
        call: machines-tokens.getoidctoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: machines-tokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for Fly.io Machines API — Tokens. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-oidc-token
      description: Get an OIDC token
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: machines-tokens.getoidctoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
