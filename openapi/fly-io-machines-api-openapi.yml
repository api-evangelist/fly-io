openapi: 3.2.0
info:
  title: Machines API
  description: This site hosts documentation generated from the Fly.io Machines API OpenAPI specification. Visit our complete Machines API docs for how to get started, more information about each endpoint, parameter descriptions, and examples.
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
servers:
- url: https://api.machines.dev
security:
- FlyBearerAuth: []
tags:
- name: Machines
  description: This site hosts documentation generated from the Fly.io Machines API OpenAPI specification. Visit our complete Machines API docs for details about using the Machines resource.
paths:
  /v1/apps/{app_name}/machines:
    get:
      tags:
      - Machines
      summary: List Machines
      description: List all Machines associated with a specific app, with optional filters for including deleted Machines and filtering by region.
      operationId: Machines_list
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: include_deleted
        in: query
        description: Include deleted machines
        schema:
          type: boolean
      - name: include_leases
        in: query
        description: Include machine leases
        schema:
          type: boolean
      - name: region
        in: query
        description: Region filter
        schema:
          type: string
      - name: state
        in: query
        description: comma separated list of states to filter (created, started, stopped, suspended)
        schema:
          type: string
      - name: summary
        in: query
        description: Only return summary info about machines (omit config, checks, events, host_status, nonce, etc.)
        schema:
          type: boolean
      - name: metadata.{key}
        in: query
        description: Filter by a machine metadata key and exact value. Replace {key} with the metadata key, for example metadata.foo=bar. Specify multiple metadata filters to require all matches.
        schema:
          type: string
      - name: cursor
        in: query
        description: Value of the fly-next-cursor response header from the previous page. Requires limit.
        schema:
          type: string
      - name: limit
        in: query
        description: The number of machines to fetch (must be between 1 and 1000). Providing a limit enables pagination. This limit is advisory; responses may be shorter, or even empty, even when more machines remain.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          headers:
            fly-next-cursor:
              description: Pagination cursor for the next page. Absent when no more machines remain. Cursor expires 30 minutes after the first page was requested.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Machine'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Machines
      summary: Create Machine
      description: 'Create a Machine within a specific app using the details provided in the request body.


        **Important**: This request can fail, and you’re responsible for handling that failure. If you ask for a large Machine, or a Machine in a region we happen to be at capacity for, you might need to retry the request, or to fall back to another region. If you’re working directly with the Machines API, you’re taking some responsibility for your own orchestration!'
      operationId: Machines_create
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      requestBody:
        description: Create machine request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/machines/{machine_id}:
    get:
      tags:
      - Machines
      summary: Get Machine
      description: Get details of a specific Machine within an app by the Machine ID.
      operationId: Machines_show
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: 26-character Machine version ID; returns that version of the Machine instead of the current one
        schema:
          type: string
      - name: include_leases
        in: query
        description: Include machine lease
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
    post:
      tags:
      - Machines
      summary: Update Machine
      description: Update a Machine's configuration using the details provided in the request body.
      operationId: Machines_update
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
    delete:
      tags:
      - Machines
      summary: Destroy Machine
      description: 'Delete a specific Machine within an app by Machine ID.


        Only a Machine in the `stopped`, `suspended`, `failed`, `pending` or `archived` state can be deleted. Deleting a Machine in any other state, such as `started`, fails with `412 Precondition Failed` unless you set `force=true`, which kills the Machine first. Deleting a Machine that is already `destroying` or `destroyed` succeeds without doing anything.


        If someone else holds a lease on the Machine, the request fails with `409 Conflict`. Pass the lease nonce in the `fly-machine-lease-nonce` header to delete a Machine you hold the lease on.'
      operationId: Machines_delete
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: Kill the Machine first if it's not stopped, suspended, failed, pending or archived
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '409':
          description: Another client holds a lease on the Machine
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: The Machine isn't stopped, suspended, failed, pending or archived, and force isn't set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/apps/{app_name}/machines/{machine_id}/cordon:
    post:
      tags:
      - Machines
      summary: Cordon Machine
      description: “Cordoning” a Machine refers to disabling its services, so the Fly Proxy won’t route requests to it. In flyctl this is used by blue/green deployments; one set of Machines is started up with services disabled, and when they are all healthy, the services are enabled on the new Machines and disabled on the old ones.
      operationId: Machines_cordon
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /v1/apps/{app_name}/machines/{machine_id}/events:
    get:
      tags:
      - Machines
      summary: List Events
      description: List all events associated with a specific Machine within an app.
      operationId: Machines_list_events
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: limit
        in: query
        description: The number of events to fetch (max of 50). If omitted, this is set to 20 by default.
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MachineEvent'
  /v1/apps/{app_name}/machines/{machine_id}/exec:
    post:
      tags:
      - Machines
      summary: Execute Command
      description: Execute a command on a specific Machine and return the raw command output bytes.
      operationId: Machines_exec
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineExecRequest'
        required: true
      responses:
        '200':
          description: stdout, stderr, exit code, and exit signal are returned
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/flydv1.ExecResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/flydv1.ExecResponse'
        '400':
          description: Bad Request
          content:
            application/octet-stream:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/machines/{machine_id}/lease:
    get:
      tags:
      - Machines
      summary: Get Lease
      description: Retrieve the current lease of a specific Machine within an app. Machine leases can be used to obtain an exclusive lock on modifying a Machine.
      operationId: Machines_show_lease
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
    post:
      tags:
      - Machines
      summary: Create Lease
      description: Create a lease for a specific Machine within an app using the details provided in the request body. Machine leases can be used to obtain an exclusive lock on modifying a Machine.
      operationId: Machines_create_lease
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: fly-machine-lease-nonce
        in: header
        description: Existing lease nonce to refresh by ttl, empty or non-existent to create a new lease
        schema:
          type: string
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeaseRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
      x-codegen-request-body-name: request
    delete:
      tags:
      - Machines
      summary: Release Lease
      description: Release the lease of a specific Machine within an app. Machine leases can be used to obtain an exclusive lock on modifying a Machine.
      operationId: Machines_release_lease
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: fly-machine-lease-nonce
        in: header
        description: Existing lease nonce
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content: {}
  /v1/apps/{app_name}/machines/{machine_id}/memory:
    get:
      tags:
      - Machines
      summary: Get Machine Memory
      description: Get current memory limit and available capacity for a machine
      operationId: Machines_get_memory
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.memoryResponse'
    put:
      tags:
      - Machines
      summary: Set Machine Memory Limit
      description: Set the memory limit for a machine using the balloon device
      operationId: Machines_set_memory_limit
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Set memory limit request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/main.setMemoryLimitRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.memoryResponse'
      x-codegen-request-body-name: body
  /v1/apps/{app_name}/machines/{machine_id}/memory/reclaim:
    post:
      tags:
      - Machines
      summary: Reclaim Machine Memory
      description: Trigger the balloon device to reclaim memory from a machine
      operationId: Machines_reclaim_memory
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Reclaim memory request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/main.reclaimMemoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/main.reclaimMemoryResponse'
      x-codegen-request-body-name: body
  /v1/apps/{app_name}/machines/{machine_id}/metadata:
    get:
      tags:
      - Machines
      summary: Get Metadata
      description: Retrieve metadata for a specific Machine within an app.
      operationId: Machines_show_metadata
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
    put:
      tags:
      - Machines
      summary: Update Metadata (deprecated PUT alias of PATCH)
      description: 'Deprecated: use `PATCH` on the same path, which this is identical to.

        + Despite the method, this does not replace the metadata: keys that are not in the request are left untouched. Null values and empty strings remove keys.

        + If `machine_version` is provided and no longer matches the current machine version, returns 412 Precondition Failed.'
      operationId: Machines_update_metadata_deprecated
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Update metadata request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateMetadataRequest'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      x-codegen-request-body-name: request
    patch:
      tags:
      - Machines
      summary: Update Metadata (set/remove multiple keys)
      description: 'Update multiple metadata keys at once. Keys that are not in the request are left untouched. Null values and empty strings remove keys.

        + If `machine_version` is provided and no longer matches the current machine version, returns 412 Precondition Failed.'
      operationId: Machines_update_metadata
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Update metadata request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateMetadataRequest'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Precondition Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/machines/{machine_id}/metadata/{key}:
    get:
      tags:
      - Machines
      summary: Get Metadata Value
      description: Get the value of a specific metadata key
      operationId: Machines_get_metadata_key
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: Metadata Key
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/metadataValueResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Machines
      summary: Upsert Metadata Key
      description: Update metadata for a specific machine within an app by providing a metadata key.
      operationId: Machines_upsert_metadata
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: Metadata Key
        required: true
        schema:
          type: string
      requestBody:
        description: Upsert metadata key request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/upsertMetadataKeyRequest'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
    delete:
      tags:
      - Machines
      summary: Delete Metadata
      description: Delete metadata for a specific Machine within an app by providing a metadata key.
      operationId: Machines_delete_metadata
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: key
        in: path
        description: Metadata Key
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content: {}
  /v1/apps/{app_name}/machines/{machine_id}/ps:
    get:
      tags:
      - Machines
      summary: List Processes
      description: List all processes running on a specific Machine within an app, with optional sorting parameters.
      operationId: Machines_list_processes
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: sort_by
        in: query
        description: Sort by
        schema:
          type: string
      - name: order
        in: query
        description: Order
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProcessStat'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/apps/{app_name}/machines/{machine_id}/restart:
    post:
      tags:
      - Machines
      summary: Restart Machine
      description: Restart a specific Machine within an app, with an optional timeout parameter.
      operationId: Machines_restart
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: timeout
        in: query
        description: Restart timeout as a Go duration string or number of seconds
        schema:
          type: string
      - name: signal
        in: query
        description: Unix signal name
        schema:
          type: string
          enum:
          - SIGHUP
          - SIGINT
          - SIGQUIT
          - SIGKILL
          - SIGUSR1
          - SIGUSR2
          - SIGTERM
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/apps/{app_name}/machines/{machine_id}/signal:
    post:
      tags:
      - Machines
      summary: Signal Machine
      description: Send a signal to a specific Machine within an app using the details provided in the request body.
      operationId: Machines_signal
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/machines/{machine_id}/start:
    post:
      tags:
      - Machines
      summary: Start Machine
      description: Start a specific Machine within an app.
      operationId: Machines_start
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartMachineResponse'
  /v1/apps/{app_name}/machines/{machine_id}/stop:
    post:
      tags:
      - Machines
      summary: Stop Machine
      description: Stop a specific Machine within an app, with an optional request body to specify signal and timeout.
      operationId: Machines_stop
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      requestBody:
        description: Optional request body
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRequest'
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/machines/{machine_id}/suspend:
    post:
      tags:
      - Machines
      summary: Suspend Machine
      description: Suspend a specific Machine within an app. The next start operation will attempt (but is not guaranteed) to resume the Machine from a snapshot taken at suspension time, rather than performing a cold boot.
      operationId: Machines_suspend
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /v1/apps/{app_name}/machines/{machine_id}/uncordon:
    post:
      tags:
      - Machines
      summary: Uncordon Machine
      description: “Cordoning” a Machine refers to disabling its services, so the Fly Proxy won’t route requests to it. In flyctl this is used by blue/green deployments; one set of Machines is started up with services disabled, and when they are all healthy, the services are enabled on the new Machines and disabled on the old ones.
      operationId: Machines_uncordon
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
  /v1/apps/{app_name}/machines/{machine_id}/versions:
    get:
      tags:
      - Machines
      summary: List Versions
      description: List all versions of the configuration for a specific Machine within an app.
      operationId: Machines_list_versions
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MachineVersion'
  /v1/apps/{app_name}/machines/{machine_id}/wait:
    get:
      tags:
      - Machines
      summary: Wait for State
      description: 'Wait for a Machine to reach a specific state. Specify the desired state with the state parameter. See the Machine states table for a list of possible states. The default for this parameter is `started`.


        This request will block for up to 60 seconds. Set a shorter timeout with the timeout parameter.'
      operationId: Machines_wait
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: machine_id
        in: path
        description: Machine ID
        required: true
        schema:
          type: string
      - name: version
        in: query
        description: 26-character Machine version ID
        schema:
          type: string
      - name: instance_id
        in: query
        description: 26-character Machine version ID (deprecated; use version)
        schema:
          type: string
      - name: from_event_id
        in: query
        description: 26-character Machine event ID to start waiting after
        schema:
          type: string
      - name: timeout
        in: query
        description: wait timeout. default 60s
        schema:
          type: integer
      - name: state
        in: query
        description: desired state(s), supports repeated or comma-separated values
        schema:
          type: string
          enum:
          - started
          - stopped
          - suspended
          - destroyed
          - failed
          - settled
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaitMachineResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
