components:
  schemas:
    PostgresUserCredentials:
      type: object
      properties:
        password:
          type: string
          description: User password.
        username:
          type: string
          description: User name.
    listPostgresUsersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresUser'
    PostgresAttachedApp:
      type: object
      properties:
        name:
          type: string
          description: Attached Fly app name.
    PostgresExtension:
      type: object
      properties:
        default_version:
          type: string
          description: Default version installed when enabled.
        description:
          type: string
          description: Human-readable description.
        installed:
          type:
          - object
          - 'null'
          properties:
            schema:
              type: string
              description: Schema the extension is installed into.
              example: public
            version:
              type: string
              description: Installed version.
              example: '1.0'
          description: Installation details, or null when the extension is not installed.
        name:
          type: string
          description: Extension name.
          example: citext
        system:
          type: boolean
          description: Whether this is a system extension that cannot be disabled.
    postgresDatabaseResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostgresDatabase'
    listPostgresPlansResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresPlan'
    PostgresNodeEndpoints:
      type: object
      properties:
        direct:
          type: object
          description: Unpooled connection to the cluster node.
          allOf:
          - $ref: '#/components/schemas/PostgresEndpoint'
        pooler:
          type: object
          description: Pooled connection to the cluster node (through PgBouncer).
          allOf:
          - $ref: '#/components/schemas/PostgresEndpoint'
    listPostgresActiveQueriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresActiveQuery'
    listPostgresBackupsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresBackup'
    listPostgresSlowQueriesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresSlowQuery'
    getPostgresUserCredentialsResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostgresUserCredentials'
    OrganizationRef:
      type: object
      properties:
        name:
          type: string
          description: Organization name.
        slug:
          type: string
          description: Organization slug.
    PostgresClusterEndpoints:
      type: object
      properties:
        primary:
          type: object
          description: Endpoints for connecting to the primary node.
          allOf:
          - $ref: '#/components/schemas/PostgresNodeEndpoints'
    createPostgresDatabaseRequest:
      required:
      - name
      type: object
      properties:
        name:
          type: string
          description: 'Name of the database to create. Must start and end with an alphanumeric

            character and may contain hyphens and underscores, up to 63 characters.'
          example: customer_data
    listPostgresExtensionsResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresExtension'
    createPostgresBackupRequest:
      required:
      - type
      type: object
      properties:
        type:
          type: string
          description: Backup type.
          example: full
          enum:
          - full
          - incr
          - diff
    rotatePostgresPasswordResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostgresUserCredentials'
    createPostgresAttachmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostgresAttachment'
    listPostgresDatabasesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresDatabase'
    PostgresSlowQuery:
      type: object
      properties:
        calls:
          type: integer
          description: Cumulative number of executions.
        database:
          type: string
          description: Database name.
        max_exec_time_seconds:
          type: number
          description: Maximum execution time in seconds.
        mean_exec_time_seconds:
          type: number
          description: Mean execution time in seconds.
        query:
          type: string
          description: Full query pattern.
        query_id:
          type: string
          description: Query identifier.
        total_exec_time_seconds:
          type: number
          description: Cumulative total execution time in seconds.
        user:
          type: string
          description: User running the query.
    PostgresAttachment:
      type: object
      properties:
        app_name:
          type: string
          description: Attached Fly app name.
        attached_at:
          type: string
          description: RFC 3339 timestamp when the attachment was created.
        postgres_cluster_id:
          type: string
          description: Cluster ID the app is attached to.
    createPostgresUserRequest:
      required:
      - role
      - username
      type: object
      properties:
        role:
          type: string
          description: Role to grant the user.
          example: writer
          enum:
          - schema_admin
          - writer
          - reader
        username:
          type: string
          description: 'Name for the new user. Must start and end with a lowercase alphanumeric

            character and may contain hyphens and underscores, up to 63 characters.'
          example: app_user
    PostgresDatabase:
      type: object
      properties:
        name:
          type: string
          description: Database name.
    PostgresErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
        status:
          type: string
          description: Optional machine-readable error status.
          example: sessions_not_terminated
    createPostgresClusterRequest:
      required:
      - org_slug
      - plan
      - region
      type: object
      properties:
        disk_size_gb:
          maximum: 1000
          minimum: 10
          type: integer
          description: Disk size in gigabytes.
          example: 10
        name:
          type: string
          description: Name for the cluster. A name is generated when omitted.
        org_slug:
          type: string
          description: Slug of the organization that will own the cluster, or "personal" for the caller's personal organization.
          example: my-org
        pg_major_version:
          type: string
          description: Postgres major version.
          example: '17'
          enum:
          - '16'
          - '17'
        plan:
          type: string
          description: Plan slug selecting CPU, memory, and disk sizing. Matched case-insensitively.
          example: basic
          enum:
          - basic
          - starter
          - launch
          - scale
          - Performance
        pool_mode:
          type: string
          description: Connection pooler mode.
          example: transaction
          enum:
          - session
          - transaction
        postgis_enabled:
          type: boolean
          description: Enable PostGIS support, required to later enable PostGIS extensions.
        region:
          type: string
          description: Fly region code where the cluster's primary runs.
          example: iad
    PostgresClusterSummary:
      type: object
      properties:
        attached_apps:
          type: array
          description: Apps attached to the cluster.
          items:
            $ref: '#/components/schemas/PostgresAttachedApp'
        created_at:
          type: string
          description: RFC 3339 creation timestamp.
          format: date-time
        deleted_at:
          type: string
          description: RFC 3339 deletion timestamp; present for deleted clusters.
        id:
          type: string
          description: Cluster ID.
        name:
          type: string
          description: Cluster name.
        plan:
          type: string
          description: Plan slug.
          example: basic
          enum:
          - basic
          - starter
          - launch
          - scale
          - Performance
        region:
          type: string
          description: Fly region code.
          example: iad
        status:
          type: string
          description: Current lifecycle status.
          example: ready
          enum:
          - creating
          - initializing
          - ready
          - deleting
          - deleted
          - failed
    PostgresCluster:
      type: object
      properties:
        attached_apps:
          type: array
          description: Apps attached to the cluster.
          items:
            $ref: '#/components/schemas/PostgresAttachedApp'
        cpu_kind:
          type: string
          description: CPU class.
          example: shared
          enum:
          - shared
          - performance
        cpus:
          type: integer
          description: vCPUs per node.
          example: 2
        created_at:
          type: string
          description: RFC 3339 creation timestamp.
          format: date-time
        disk_size_gb:
          type: integer
          description: Disk size in gigabytes, for one replica.
          example: 10
        endpoints:
          type: object
          description: Connection endpoints. Populated once the cluster is ready.
          allOf:
          - $ref: '#/components/schemas/PostgresClusterEndpoints'
        id:
          type: string
          description: Cluster ID.
        memory_mb:
          type: integer
          description: Memory per node in megabytes.
          example: 1024
        name:
          type: string
          description: Cluster name.
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        pg_major_version:
          type: string
          description: Postgres major version.
          example: '17'
          enum:
          - '16'
          - '17'
        plan:
          type: string
          description: Plan slug.
          example: basic
          enum:
          - basic
          - starter
          - launch
          - scale
          - Performance
        postgis_enabled:
          type: boolean
          description: Whether PostGIS support is enabled.
        region:
          type: string
          description: Fly region code.
          example: iad
        replicas:
          type: integer
          description: Number of replicas.
          example: 1
        status:
          type: string
          description: Current lifecycle status.
          example: ready
          enum:
          - creating
          - initializing
          - ready
          - deleting
          - deleted
          - failed
        storage_provisioned_bytes:
          type:
          - integer
          - 'null'
          description: 'Storage provisioned, summed across the cluster''s volumes and measured hourly.

            Null until first measured.'
          example: 10737418240
        storage_used_bytes:
          type:
          - integer
          - 'null'
          description: 'Storage used, summed across the cluster''s volumes and measured hourly. Null

            until first measured.'
          example: 5368709120
    listPostgresClustersResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PostgresClusterSummary'
    createPostgresUserResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostgresUser'
    PostgresEndpoint:
      type: object
      properties:
        host:
          type: string
          description: Hostname to connect to.
        port:
          type: integer
          description: TCP port.
    forkPostgresClusterRequest:
      type: object
      properties:
        name:
          type: string
          description: Name for the forked cluster. Defaults to the source name with a -fork suffix.
        plan:
          type: string
          description: Plan slug selecting CPU and memory sizing for the fork. Defaults to the source cluster's plan. Matched case-insensitively.
          example: launch
          enum:
          - basic
          - starter
          - launch
          - scale
          - Performance
    updatePostgresUserRoleRequest:
      required:
      - role
      type: object
      properties:
        role:
          type: string
          description: New role for the user.
          example: reader
          enum:
          - schema_admin
          - writer
          - reader
    showPostgresClusterResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/PostgresCluster'
    PostgresBackup:
      type: object
      properties:
        finished_at:
          type: string
          description: RFC 3339 stop timestamp.
        id:
          type: string
          description: Backup ID.
        size_bytes:
          type: integer
          description: Backup size in bytes.
        started_at:
          type: string
          description: RFC 3339 start timestamp.
        status:
          type: string
          description: Backup status.
          example: completed
        type:
          type: string
          description: Backup type.
          enum:
          - full
          - incr
          - diff
    rotatePostgresPasswordRequest:
      type: object
      properties:
        kill_sessions:
          type: boolean
          description: Terminate the user's existing sessions after rotating.
    createPostgresAttachmentRequest:
      required:
      - app_name
      type: object
      properties:
        app_name:
          type: string
          description: Name of the Fly app to attach.
    enablePostgresExtensionRequest:
      required:
      - name
      type: object
      properties:
        create_schema:
          type: boolean
          description: Create the schema first if it does not exist.
        name:
          type: string
          description: Extension to enable.
          example: citext
        schema:
          type: string
          description: Schema to install the extension into. Defaults to the database's default schema.
    PostgresActiveQuery:
      type: object
      properties:
        application_name:
          type: string
          description: Application connected to the backend.
        client:
          type: string
          description: Client address.
        database:
          type: string
          description: Database name.
        duration_seconds:
          type: number
          description: Query duration in seconds.
        pid:
          type: integer
          description: Process ID of the backend running the query.
        query:
          type: string
          description: Full query text.
        state:
          type: string
          description: Current backend state.
        state_duration_seconds:
          type: number
          description: Time spent in the current state, in seconds.
        user:
          type: string
          description: User running the query.
        wait_event:
          type: string
          description: Event the backend is waiting for.
        wait_event_type:
          type: string
          description: Type of event the backend is waiting for.
    restorePostgresClusterRequest:
      type: object
      properties:
        backup_id:
          type: string
          description: Backup label to restore from, as returned by the backups list. Mutually exclusive with pitr_time.
        name:
          type: string
          description: Name for the restored cluster. Defaults to a generated name derived from the source cluster and backup/point in time when omitted or blank.
        pitr_time:
          type: string
          description: Point in time to restore to, as an RFC3339 timestamp with an explicit offset from UTC (e.g. Z or +02:00). Normalized to UTC and must fall within the cluster's PITR recovery window. Mutually exclusive with backup_id.
    PostgresPlan:
      type: object
      properties:
        cpu_kind:
          type: string
          description: CPU class.
          example: shared
          enum:
          - shared
          - performance
        cpus:
          type: integer
          description: vCPUs per node.
          example: 2
        memory_mb:
          type: integer
          description: Memory per node in megabytes.
          example: 1024
        monthly_price_usd:
          type: integer
          description: Base monthly price in US dollars.
          example: 38
        plan:
          type: string
          description: Plan slug. Pass it as `plan` when creating or forking a cluster.
          example: basic
          enum:
          - basic
          - starter
          - launch
          - scale
          - Performance
    PostgresUser:
      type: object
      properties:
        role:
          type: string
          description: User role.
          enum:
          - schema_admin
          - writer
          - reader
        username:
          type: string
          description: User name.
  securitySchemes:
    FlyBearerAuth:
      type: http
      scheme: bearer
