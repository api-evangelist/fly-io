openapi: 3.2.0
info:
  title: Machines Postgres Clusters API
  description: This site hosts documentation generated from the Fly.io Machines API OpenAPI specification. Visit our complete Machines API docs for how to get started, more information about each endpoint, parameter descriptions, and examples.
  contact: {}
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: '1.0'
servers:
- url: https://api.machines.dev
security:
- FlyBearerAuth: []
tags:
- name: Postgres Clusters
  description: Create and manage Postgres clusters, including databases, users, extensions, backups, and app attachments.
paths:
  /v1/postgres:
    get:
      tags:
      - Postgres Clusters
      summary: List Postgres Clusters
      description: List Managed Postgres clusters for an organization.
      operationId: Postgres_list
      parameters:
      - name: org_slug
        in: query
        description: Fly Organization Slug, or 'personal' for the caller's personal organization
        required: true
        schema:
          type: string
      - name: include_deleted
        in: query
        description: Include deleted clusters
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresClustersResponse'
        '400':
          description: org_slug is required and must be a string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: include_deleted must be true or false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
    post:
      tags:
      - Postgres Clusters
      summary: Create Postgres Cluster
      description: 'Create a Managed Postgres cluster for the organization named in the request body. Provisioning is asynchronous: poll `GET /v1/postgres/{id}` until `status == ready` before calling database, user, extension, or credential endpoints.'
      operationId: Postgres_create
      requestBody:
        description: Cluster details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createPostgresClusterRequest'
        required: true
      responses:
        '201':
          description: Cluster accepted for provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/showPostgresClusterResponse'
        '400':
          description: org_slug is required and must be a string, or creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: Invalid attributes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
      x-codegen-request-body-name: request
  /v1/postgres/plans:
    get:
      tags:
      - Postgres Clusters
      summary: List Postgres Plans
      description: List the Managed Postgres plans the caller can choose when creating or forking a cluster in an organization, cheapest first.
      operationId: Postgres_plans_list
      parameters:
      - name: org_slug
        in: query
        description: Fly Organization Slug, or 'personal' for the caller's personal organization
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresPlansResponse'
        '400':
          description: org_slug is required and must be a string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Organization not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}:
    get:
      tags:
      - Postgres Clusters
      summary: Get Postgres Cluster
      description: Get details of a specific Managed Postgres cluster.
      operationId: Postgres_show
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/showPostgresClusterResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
    delete:
      tags:
      - Postgres Clusters
      summary: Delete Postgres Cluster
      description: Delete a Managed Postgres cluster. The cluster is marked for deletion and removed asynchronously.
      operationId: Postgres_delete
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '410':
          description: '''This cluster has been deleted'' or ''This cluster is being deleted'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}/attachments:
    post:
      tags:
      - Postgres Clusters
      summary: Attach Cluster to App
      description: Record an attachment between a cluster and a Fly app. This endpoint records the relationship but does not set DATABASE_URL or other app secrets; configure the connection string separately. The attachment is created if it does not already exist.
      operationId: Postgres_attachments_create
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      requestBody:
        description: Attachment details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createPostgresAttachmentRequest'
        required: true
      responses:
        '200':
          description: Cluster was already attached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPostgresAttachmentResponse'
        '201':
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createPostgresAttachmentResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: '''Cluster not found'' for the cluster; ''App not found'' for the app'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '410':
          description: '''This cluster has been deleted'' or ''This cluster is being deleted'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
      x-codegen-request-body-name: request
  /v1/postgres/{postgres_cluster_id}/attachments/{app_name}:
    delete:
      tags:
      - Postgres Clusters
      summary: Detach Cluster from App
      description: Detach a specific cluster from a Fly app.
      operationId: Postgres_attachments_delete
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: '''Cluster not found'' for the cluster; ''App not found'' for the app; ''Attachment not found'' for the attachment'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '410':
          description: '''This cluster has been deleted'' or ''This cluster is being deleted'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}/backups:
    get:
      tags:
      - Postgres Clusters
      summary: List Backups
      description: List all backups associated with a specific cluster.
      operationId: Postgres_backups_list
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresBackupsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
    post:
      tags:
      - Postgres Clusters
      summary: Create Backup
      description: Create a backup for a specific cluster. The backup runs asynchronously and is rejected if one is already in progress.
      operationId: Postgres_backups_create
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      requestBody:
        description: Backup details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createPostgresBackupRequest'
        required: true
      responses:
        '202':
          description: Accepted
          content: {}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '409':
          description: A backup is currently running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
      x-codegen-request-body-name: request
  /v1/postgres/{postgres_cluster_id}/databases:
    get:
      tags:
      - Postgres Clusters
      summary: List Databases
      description: List all databases within a specific cluster.
      operationId: Postgres_databases_list
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresDatabasesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '503':
          description: pg-admin is unavailable; retry after the interval given by the Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
    post:
      tags:
      - Postgres Clusters
      summary: Create Database
      description: Create a database within a specific cluster.
      operationId: Postgres_databases_create
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      requestBody:
        description: Database details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createPostgresDatabaseRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postgresDatabaseResponse'
        '400':
          description: Database name is reserved, a system database, or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: name is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '503':
          description: pg-admin is unavailable; retry after the interval given by the Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
      x-codegen-request-body-name: request
  /v1/postgres/{postgres_cluster_id}/databases/{database_name}:
    delete:
      tags:
      - Postgres Clusters
      summary: Drop Database
      description: Delete a specific database within a cluster, along with objects that depend on it.
      operationId: Postgres_databases_delete
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: database_name
        in: path
        description: Database Name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postgresDatabaseResponse'
        '400':
          description: Database name is reserved, a system database, or malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: '''Cluster not found'' for the cluster; ''Database not found'' for the database'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '503':
          description: pg-admin is unavailable; retry after the interval given by the Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}/databases/{database_name}/extensions:
    get:
      tags:
      - Postgres Clusters
      summary: List Extensions
      description: List all extensions available within a specific database, indicating which are installed.
      operationId: Postgres_extensions_list
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: database_name
        in: path
        description: Database Name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresExtensionsResponse'
        '400':
          description: Database name is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '503':
          description: pg-admin is unavailable; retry after the interval given by the Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
    post:
      tags:
      - Postgres Clusters
      summary: Enable Extension
      description: Enable a Postgres extension within a specific database. PostGIS extensions require a PostGIS-enabled cluster.
      operationId: Postgres_extensions_enable
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: database_name
        in: path
        description: Database Name
        required: true
        schema:
          type: string
      requestBody:
        description: Extension details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/enablePostgresExtensionRequest'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Database name is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '409':
          description: '''PostGIS is not enabled on this cluster'' or ''Extension <name> is already installed in schema <schema>'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: Unknown or unsupported extension
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '503':
          description: pg-admin is unavailable; retry after the interval given by the Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
      x-codegen-request-body-name: request
  /v1/postgres/{postgres_cluster_id}/databases/{database_name}/extensions/{extension_name}:
    delete:
      tags:
      - Postgres Clusters
      summary: Disable Extension
      description: Disable a specific Postgres extension within a database, optionally dropping objects that depend on it. System extensions cannot be disabled.
      operationId: Postgres_extensions_disable
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: database_name
        in: path
        description: Database Name
        required: true
        schema:
          type: string
      - name: extension_name
        in: path
        description: Extension Name
        required: true
        schema:
          type: string
      - name: force
        in: query
        description: Also drop objects that depend on the extension
        schema:
          type: boolean
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: '''System extensions cannot be disabled'' or ''Database name is malformed'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: Invalid extension name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '503':
          description: pg-admin is unavailable; retry after the interval given by the Retry-After header
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}/fork:
    post:
      tags:
      - Postgres Clusters
      summary: Fork Cluster to New Cluster
      description: Fork a ready Managed Postgres cluster into a new cluster that inherits the source's settings, on the source's plan unless `plan` is given. The source cluster is left unchanged, and the fork is provisioned asynchronously.
      operationId: Postgres_fork
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      requestBody:
        description: Fork details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/forkPostgresClusterRequest'
        required: false
      responses:
        '201':
          description: New cluster provisioned from the fork
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/showPostgresClusterResponse'
        '400':
          description: Fork failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '409':
          description: The source cluster is not ready to be forked yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '410':
          description: '''This cluster has been deleted'' or ''This cluster is being deleted'''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: Invalid attributes, such as an unknown or unavailable plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
      x-codegen-request-body-name: request
  /v1/postgres/{postgres_cluster_id}/queries/active:
    get:
      tags:
      - Postgres Clusters
      summary: List Active Queries
      description: List active queries in the supplied database. The database query parameter is required and must not be empty or whitespace-only. Returns full query text and durations in seconds.
      operationId: Postgres_queries_active
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: database
        in: query
        description: Database to inspect (must not be empty or whitespace-only)
        required: true
        schema:
          minLength: 1
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresActiveQueriesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: database must be a non-empty string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '500':
          description: Unable to load active queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}/queries/slow:
    get:
      tags:
      - Postgres Clusters
      summary: List Slow Queries
      description: List the top 20 queries by cumulative total execution time, excluding the postgres database. Uses the latest available metrics within the lookback range; statistics are cumulative PostgreSQL counters, not deltas over that range. Returns full query text and execution times in seconds.
      operationId: Postgres_queries_slow
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      - name: range
        in: query
        description: Metrics lookback in seconds
        schema:
          maximum: 604800
          minimum: 1
          type: integer
          default: 3600
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/listPostgresSlowQueriesResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '404':
          description: Cluster not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '422':
          description: range must be an integer between 1 and 604800 seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
        '500':
          description: Unable to load slow query metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
  /v1/postgres/{postgres_cluster_id}/restore:
    post:
      tags:
      - Postgres Clusters
      summary: Restore Backup or Point in Time to New Cluster
      description: Restore a backup, or a point in time within the cluster's PITR recovery window, into a new Managed Postgres cluster. The source cluster is left unchanged, and a new cluster is provisioned asynchronously.
      operationId: Postgres_restore
      parameters:
      - name: postgres_cluster_id
        in: path
        description: Managed Postgres Cluster ID
        required: true
        schema:
          type: string
      requestBody:
        description: Restore details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/restorePostgresClusterRequest'
        required: true
      responses:
        '201':
          description: New cluster provisioned from the backup or point in time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/showPostgresClusterResponse'
        '400':
          description: Restore failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostgresErrorResponse'
