        schema:
          type: string
      requestBody:
        description: Verify with secret key request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySecretkeyRequest'
        required: true
      responses:
        '204':
          description: No Content
          content: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/secrets:
    get:
      tags:
      - Secrets
      summary: List app secrets belonging to an app
      operationId: Secrets_list
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: min_version
        in: query
        description: Minimum secrets version to return. Returned when setting a new secret
        schema:
          type: string
      - name: show_secrets
        in: query
        description: Show the secret values.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecrets'
    post:
      tags:
      - Secrets
      summary: Update app secrets belonging to an app
      description: 'Running Machines don''t pick up the change on their own: create or update Machines with `min_secrets_version` set to the returned `version` for them to see it.'
      operationId: Secrets_update
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      requestBody:
        description: Update app secret request, with values to set, or nil to unset
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppSecretsUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecretsUpdateResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/secrets/{secret_name}:
    get:
      tags:
      - Secrets
      summary: Get an app secret
      operationId: Secret_get
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: App secret name
        required: true
        schema:
          type: string
      - name: min_version
        in: query
        description: Minimum secrets version to return. Returned when setting a new secret
        schema:
          type: string
      - name: show_secrets
        in: query
        description: Show the secret value.
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppSecret'
    post:
      tags:
      - Secrets
      summary: Create or update Secret
      description: 'Running Machines don''t pick up the change on their own: create or update Machines with `min_secrets_version` set to the returned `version` for them to see it.'
      operationId: Secret_create
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: App secret name
        required: true
        schema:
          type: string
      requestBody:
        description: Create app secret request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAppSecretRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAppSecretResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
    delete:
      tags:
      - Secrets
      summary: Delete an app secret
      description: 'Running Machines don''t pick up the change on their own: create or update Machines with `min_secrets_version` set to the returned `version` for them to see it.'
      operationId: Secret_delete
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: App secret name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAppSecretResponse'
components:
  schemas:
    AppSecretsUpdateResp:
      type: object
      properties:
        Version:
          type: integer
          description: DEPRECATED
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/AppSecret'
        version:
          type: integer
          description: 'The app''s secrets version after this change. Pass it as `min_secrets_version` when creating or

            updating Machines so that they are guaranteed to see the change.'
    SetAppSecretRequest:
      type: object
      properties:
        value:
          type: string
    DecryptSecretkeyRequest:
      type: object
      properties:
        associated_data:
          type: array
          items:
            type: integer
        ciphertext:
          type: array
          items:
            type: integer
    AppSecretsUpdateRequest:
      type: object
      properties:
        values:
          type: object
          additionalProperties:
            type: string
    EncryptSecretkeyResponse:
      type: object
      properties:
        ciphertext:
          type: array
          items:
            type: integer
    SetSecretkeyResponse:
      type: object
      properties:
        Version:
          type: integer
          description: DEPRECATED
        created_at:
          type: string
        name:
          type: string
        public_key:
          type: array
          items:
            type: integer
        type:
          type: string
        updated_at:
          type: string
        version:
          type: integer
    SetSecretkeyRequest:
      type: object
      properties:
        type:
          type: string
        value:
          type: array
          items:
            type: integer
    SignSecretkeyRequest:
      type: object
      properties:
        plaintext:
          type: array
          items:
            type: integer
    AppSecrets:
      type: object
      properties:
        secrets:
          type: array
          items:
            $ref: '#/components/schemas/AppSecret'
    main.statusCode:
      type: string
      enum:
      - unknown
      - insufficient_capacity
      - volume_placement_capacity
      - name_taken
      x-enum-varnames:
      - unknown
      - capacityErr
      - volumePlacementCapacityErr
      - nameTakenErr
    SecretKeys:
      type: object
      properties:
        secret_keys:
          type: array
          items:
            $ref: '#/components/schemas/SecretKey'
    AppSecret:
      type: object
      properties:
        created_at:
          type: string
        digest:
          type: string
        name:
          type: string
        updated_at:
          type: string
        value:
          type: string
    ErrorResponse:
      type: object
      properties:
        details:
          type: object
          description: Deprecated
        error:
          type: string
        status:
          $ref: '#/components/schemas/main.statusCode'
    SetAppSecretResponse:
      type: object
      properties:
        Version:
          type: integer
          description: DEPRECATED
        created_at:
          type: string
        digest:
          type: string
        name:
          type: string
        updated_at:
          type: string
        value:
          type: string
        version:
          type: integer
          description: 'The app''s secrets version after this change. Pass it as `min_secrets_version` when creating or

            updating Machines so that they are guaranteed to see the change.'
    SignSecretkeyResponse:
      type: object
      properties:
        signature:
          type: array
          items:
            type: integer
    DeleteAppSecretResponse:
      type: object
      properties:
        Version:
          type: integer
          description: DEPRECATED
        version:
          type: integer
          description: 'The app''s secrets version after this change. Pass it as `min_secrets_version` when creating or

            updating Machines so that they are guaranteed to see the change.'
    DecryptSecretkeyResponse:
      type: object
      properties:
        plaintext:
          type: array
          items:
            type: integer
    SecretKey:
      type: object
      properties:
        created_at:
          type: string
        name:
          type: string
        public_key:
          type: array
          items:
            type: integer
        type:
          type: string
        updated_at:
          type: string
    DeleteSecretkeyResponse:
      type: object
      properties:
        Version:
          type: integer
          description: DEPRECATED
        version:
          type: integer
    EncryptSecretkeyRequest:
      type: object
      properties:
        associated_data:
          type: array
          items:
            type: integer
        plaintext:
          type: array
          items:
            type: integer
    VerifySecretkeyRequest:
      type: object
      properties:
        plaintext:
          type: array
          items:
            type: integer
        signature:
          type: array
          items:
            type: integer
  securitySchemes:
    FlyBearerAuth:
      type: http
      scheme: bearer
      description: 'A Fly API token with access to the requested organization or resource. Send it as `Authorization: Bearer <Fly API token>`.'
externalDocs:
