      x-codegen-request-body-name: request
  /v1/apps/{app_name}/secretkeys/{secret_name}/generate:
    post:
      tags:
      - Secrets
      summary: Generate a random secret key
      operationId: Secretkey_generate
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
        required: true
        schema:
          type: string
      requestBody:
        description: generate secret key request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSecretkeyRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetSecretkeyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/secretkeys/{secret_name}/sign:
    post:
      tags:
      - Secrets
      summary: Sign with a secret key
      operationId: Secretkey_sign
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
