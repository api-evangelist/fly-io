                $ref: '#/components/schemas/DecryptSecretkeyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
  /v1/apps/{app_name}/secretkeys/{secret_name}/encrypt:
    post:
      tags:
      - Secrets
      summary: Encrypt with a secret key
      operationId: Secretkey_encrypt
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
        required: true
        schema:
          type: string
      - name: min_version
        in: query
        description: Minimum secrets version to return. Returned when setting a new secret
        schema:
          type: string
      requestBody:
        description: Encrypt with secret key request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EncryptSecretkeyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EncryptSecretkeyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
