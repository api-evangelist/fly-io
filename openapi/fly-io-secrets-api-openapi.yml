tags:
- name: Secrets
paths:
  /v1/apps/{app_name}/secretkeys:
    get:
      tags:
      - Secrets
      summary: List secret keys belonging to an app
      operationId: Secretkeys_list
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: min_version
        in: query
        description: Minimum secrets version to return. Returned when setting a new secret
        schema:
          type: string
      - name: types
        in: query
        description: Comma-seperated list of secret keys to list
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretKeys'
  /v1/apps/{app_name}/secretkeys/{secret_name}:
    get:
      tags:
      - Secrets
      summary: Get an app's secret key
      operationId: Secretkey_get
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
        required: true
        schema:
          type: string
      - name: min_version
        in: query
        description: Minimum secrets version to return. Returned when setting a new secret
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretKey'
    post:
      tags:
      - Secrets
      summary: Create or update a secret key
      operationId: Secretkey_set
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
        required: true
        schema:
          type: string
      requestBody:
        description: Create secret key request
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSecretkeyRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetSecretkeyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-codegen-request-body-name: request
    delete:
      tags:
      - Secrets
      summary: Delete an app's secret key
      operationId: Secretkey_delete
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSecretkeyResponse'
  /v1/apps/{app_name}/secretkeys/{secret_name}/decrypt:
    post:
      tags:
      - Secrets
      summary: Decrypt with a secret key
      operationId: Secretkey_decrypt
      parameters:
      - name: app_name
        in: path
        description: Fly App Name
        required: true
        schema:
          type: string
      - name: secret_name
        in: path
        description: Secret key name
        required: true
